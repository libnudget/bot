name: bot-identity commit
description: Commit changes using the bot-identity bot identity
author: coccinella-labs

inputs:
  message:
    description: Commit message
    required: true

runs:
  using: composite
  steps:
    - run: |
        chmod +x ${{ github.action_path }}/entrypoint.sh
        ${{ github.action_path }}/entrypoint.sh "${{ inputs.message }}"
      shell: bash
